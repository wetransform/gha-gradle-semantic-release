name: Test scripts

on:
  pull_request: {}
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - run: mise run test
