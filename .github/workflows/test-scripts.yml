name: Test scripts

on:
  pull_request: {}
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - run: mise run test
