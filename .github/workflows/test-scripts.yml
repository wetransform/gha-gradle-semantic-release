name: Test scripts

on:
  pull_request: {}
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      - run: mise run test
